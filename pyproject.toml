[project]
name = "bench"
version = "0.1.0"
description = "Benchmark MediaPipe Pose Landmarker variants on the Arduino UNO Q"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe==0.10.18", "numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
