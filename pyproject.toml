[project]
name = "bench"
version = "0.1.0"
description = "Benchmark MediaPipe Pose Landmarker variants on the Arduino UNO Q"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe==0.10.18", "numpy"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
